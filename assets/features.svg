<text x="90.0" y="275" class="f" font-size="21" font-weight="800" fill="#F5F5F8">MCP server</text>
<text x="28.0" y="336" class="f" font-size="16.5" fill="#A3A3B5">OAuth 2.1 + PKCE, 9 tools,</text><text x="28.0" y="361" class="f" font-size="16.5" fill="#A3A3B5">per-tool scopes, audit log.</text><rect x="407.8333333333333" y="218.5" width="384.3333333333333" height="195" rx="20" fill="#101018" stroke="#F5A044" stroke-opacity=".28"/>
<rect x="408.3333333333333" y="219" width="383.3333333333333" height="70" rx="20" fill="#F5A044" opacity=".05"/>
<rect x="435.3333333333333" y="244" width="46" height="46" rx="14" fill="#F5A044" fill-opacity=".16" stroke="#F5A044" stroke-opacity=".55"/>
