<text x="90.0" y="57" class="f" font-size="21" font-weight="800" fill="#F5F5F8">Omnichannel</text>
<text x="28.0" y="118" class="f" font-size="16.5" fill="#A3A3B5">WhatsApp, a one-tag website widget</text><text x="28.0" y="143" class="f" font-size="16.5" fill="#A3A3B5">and Gmail feed the same agent.</text><rect x="407.8333333333333" y="0.5" width="384.3333333333333" height="195" rx="20" fill="#101018" stroke="#3BA4F0" stroke-opacity=".28"/>
<rect x="408.3333333333333" y="1" width="383.3333333333333" height="70" rx="20" fill="#3BA4F0" opacity=".05"/>
<rect x="435.3333333333333" y="26" width="46" height="46" rx="14" fill="#3BA4F0" fill-opacity=".16" stroke="#3BA4F0" stroke-opacity=".55"/>
<g transform="translate(446.3333333333333 37) scale(1.0)" fill="none" stroke="#3BA4F0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></g>
<text x="497.3333333333333" y="57" class="f" font-size="21" font-weight="800" fill="#F5F5F8">Agentic RAG</text>
<text x="435.3333333333333" y="118" class="f" font-size="16.5" fill="#A3A3B5">Retrieve → grade → rewrite over</text><text x="435.3333333333333" y="143" class="f" font-size="16.5" fill="#A3A3B5">catalog, FAQs, docs and profile.</text><rect x="815.1666666666666" y="0.5" width="384.3333333333333" height="195" rx="20" fill="#101018" stroke="#D06CC0" stroke-opacity=".28"/>
