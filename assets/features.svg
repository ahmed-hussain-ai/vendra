<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="414" viewBox="0 0 1200 414"><defs><linearGradient id="fi0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B8CFF"/><stop offset="1" stop-color="#5B45E0"/></linearGradient><linearGradient id="fi1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3BA4F0"/><stop offset="1" stop-color="#3BA4F0"/></linearGradient><linearGradient id="fi2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D06CC0"/><stop offset="1" stop-color="#D06CC0"/></linearGradient><linearGradient id="fi3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3DD68C"/><stop offset="1" stop-color="#3DD68C"/></linearGradient><linearGradient id="fi4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5A044"/><stop offset="1" stop-color="#F5A044"/></linearGradient><linearGradient id="fi5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C6CF0"/><stop offset="1" stop-color="#5B45E0"/></linearGradient><style>
  .f { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .pulse { animation: pulse 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .pulse2 { animation: pulse 10s ease-in-out infinite reverse; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%,100% { opacity: .65; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
  .blink { animation: blink 1.8s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  .scan { animation: scan 6s linear infinite; }
  @keyframes scan { from { transform: translateY(-120px); } to { transform: translateY(620px); } }
  .flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  .caret { animation: blink 1s steps(1) infinite; }
