<text x="497.3333333333333" y="275" class="f" font-size="21" font-weight="800" fill="#F5F5F8">Multi-tenant</text>
<text x="435.3333333333333" y="336" class="f" font-size="16.5" fill="#A3A3B5">One codebase, many businesses,</text><text x="435.3333333333333" y="361" class="f" font-size="16.5" fill="#A3A3B5">isolation enforced in one place.</text><rect x="815.1666666666666" y="218.5" width="384.3333333333333" height="195" rx="20" fill="#101018" stroke="#7C6CF0" stroke-opacity=".28"/>
<rect x="815.6666666666666" y="219" width="383.3333333333333" height="70" rx="20" fill="#7C6CF0" opacity=".05"/>
<rect x="842.6666666666666" y="244" width="46" height="46" rx="14" fill="#7C6CF0" fill-opacity=".16" stroke="#7C6CF0" stroke-opacity=".55"/>
<g transform="translate(853.6666666666666 255) scale(1.0)" fill="none" stroke="#7C6CF0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></g>
<text x="904.6666666666666" y="275" class="f" font-size="21" font-weight="800" fill="#F5F5F8">Books and sells</text>
<text x="842.6666666666666" y="336" class="f" font-size="16.5" fill="#A3A3B5">Meetings, Stripe payment links</text><text x="842.6666666666666" y="361" class="f" font-size="16.5" fill="#A3A3B5">and human handover in the chat.</text></svg>