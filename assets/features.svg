<g transform="translate(853.6666666666666 37) scale(1.0)" fill="none" stroke="#D06CC0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g>
<text x="904.6666666666666" y="57" class="f" font-size="21" font-weight="800" fill="#F5F5F8">Grounding check</text>
<text x="842.6666666666666" y="118" class="f" font-size="16.5" fill="#A3A3B5">Every claim must cite a passage,</text><text x="842.6666666666666" y="143" class="f" font-size="16.5" fill="#A3A3B5">or the reply is rewritten.</text><rect x="0.5" y="218.5" width="384.3333333333333" height="195" rx="20" fill="#101018" stroke="#3DD68C" stroke-opacity=".28"/>
<rect x="1.0" y="219" width="383.3333333333333" height="70" rx="20" fill="#3DD68C" opacity=".05"/>
<rect x="28.0" y="244" width="46" height="46" rx="14" fill="#3DD68C" fill-opacity=".16" stroke="#3DD68C" stroke-opacity=".55"/>
